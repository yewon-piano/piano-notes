:root{
  --night:#101A2E; --night2:#18264A; --panel:#1F2F55; --ink:#EEF3FF; --sub:#9FB0D4;
  --paper:#F6F1E3; --staff:#1B2238; --gold:#FFC93C; --gold-ink:#2B1D00;
  --ok:#3DDC84; --bad:#FF5C6C; --sil:#3A4A72;
  --press:0 5px 0 rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Do Hyeon","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:radial-gradient(120% 70% at 50% 0%,#22356A 0%,var(--night) 60%);
  background-color:var(--night); color:var(--ink);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  user-select:none; -webkit-user-select:none; overflow:hidden;
}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{max-width:480px;height:100%;margin:0 auto;position:relative}
.screen{display:none;flex-direction:column;height:100%;padding:14px 14px 16px}
.screen.active{display:flex}
.disp{font-family:"Black Han Sans","Do Hyeon",sans-serif;font-weight:normal}

/* ---------- 시작 ---------- */
#start{justify-content:space-between}
.title{font-size:46px;line-height:1.05;margin-top:16px;text-align:center;letter-spacing:-1px}
.title span{display:block;font-size:18px;color:var(--sub);font-family:"Do Hyeon",sans-serif;letter-spacing:0;margin-top:10px}
.parade{display:flex;justify-content:center;gap:4px;margin:18px 0 0}
.parade svg{width:44px;height:44px}
.stages{display:flex;flex-direction:column;gap:8px}
.stage-btn{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:var(--press);border:2px solid transparent}
.stage-btn .no{font-family:"Black Han Sans",sans-serif;font-size:26px;width:30px;color:var(--gold)}
.stage-btn .tx{flex:1;font-size:19px}
.stage-btn .tx small{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.stage-btn .rec{text-align:right;font-size:13px;color:var(--sub)}
.stage-btn .rec b{display:block;color:var(--gold);font-weight:normal;font-size:15px;letter-spacing:1px}
.stage-btn.sel{border-color:var(--gold);background:var(--night2)}
.big{width:100%;font-size:26px;padding:16px;border-radius:18px;background:var(--gold);color:var(--gold-ink);box-shadow:var(--press);margin-top:12px;font-family:"Black Han Sans",sans-serif}
.ghost{width:100%;font-size:19px;padding:13px;border-radius:16px;background:var(--panel);box-shadow:var(--press);margin-top:10px}
.big:active,.ghost:active,.stage-btn:active,.key:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}

/* ---------- 게임 ---------- */
.top{display:flex;align-items:center;gap:8px}
.back{background:var(--panel);border-radius:10px;padding:7px 11px;font-size:15px;box-shadow:var(--press)}
.stage-tag{flex:1;text-align:center;font-size:16px;color:var(--sub)}
.score{font-family:"Black Han Sans",sans-serif;font-size:22px;color:var(--gold);min-width:70px;text-align:right}

.party{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:rgba(0,0,0,.25);border-radius:14px;padding:6px 4px 4px;margin-top:10px}
.pm{text-align:center;font-size:14px;color:var(--sub);line-height:1}
.pm svg{width:100%;max-width:40px;height:auto;display:block;margin:0 auto}
.pm b{font-weight:normal;color:var(--ink)}
.pm.pop svg{animation:pop .6s}
@keyframes pop{30%{transform:scale(1.5)}}

.encounter{display:flex;align-items:center;gap:12px;margin:12px 2px 8px;min-height:92px}
.portrait{width:88px;height:88px;flex:none;border-radius:20px;background:rgba(0,0,0,.28);display:grid;place-items:center;position:relative;overflow:hidden}
.portrait svg{width:80px;height:80px}
.portrait.reveal{animation:flash .6s}
@keyframes flash{0%{background:#fff}100%{background:rgba(0,0,0,.28)}}
.status{flex:1;min-width:0}
.status .line1{font-size:17px;color:var(--sub)}
.status .line2{font-family:"Black Han Sans",sans-serif;font-size:29px;line-height:1.15;margin-top:2px;word-break:keep-all}
.status .line2 small{font-family:"Do Hyeon",sans-serif;font-size:20px;color:var(--ink);margin-left:4px}

.field{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center}
.staff-card{background:var(--paper);border-radius:18px;box-shadow:var(--press);overflow:hidden;position:relative}
.staff-card svg{width:100%;height:auto;display:block}
.timer{position:absolute;left:0;bottom:0;height:5px;background:var(--bad);width:0}
.runner .legs{animation:run .16s infinite alternate}
.runner .leg2{animation:run .16s infinite alternate-reverse}
.runner .tails{transform-box:fill-box;transform-origin:100% 50%;animation:flap .22s infinite alternate}
.runner .dust circle{animation:dust .5s infinite}
.runner .dust circle:nth-child(2){animation-delay:.15s}.runner .dust circle:nth-child(3){animation-delay:.3s}
@keyframes flap{from{transform:rotate(-10deg) scaleX(.92)}to{transform:rotate(8deg) scaleX(1.05)}}
@keyframes dust{0%{opacity:.55;transform:translateX(0)}100%{opacity:0;transform:translateX(-8px)}}
@keyframes run{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
.float{position:absolute;font-family:"Black Han Sans",sans-serif;font-size:26px;color:#12924A;text-shadow:0 2px 0 rgba(255,255,255,.6);pointer-events:none;transform:translate(-50%,-50%);animation:up .9s forwards}
@keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
.combo{position:absolute;right:10px;top:8px;font-family:"Black Han Sans",sans-serif;font-size:18px;color:#B4361F;opacity:0;transition:.2s}
.combo.on{opacity:1}
.progress{display:flex;gap:3px;margin-top:10px}
.progress i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.progress i.ok{background:var(--ok)} .progress i.miss{background:var(--bad)} .progress i.now{background:var(--sub)}

.keys{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;padding-top:12px}
.key{grid-column:span 3;border-radius:14px;padding:18px 0 14px;font-size:28px;background:var(--panel);box-shadow:var(--press);border-bottom:6px solid var(--c);font-family:"Black Han Sans",sans-serif}
.key:nth-child(n+5){grid-column:span 4}
.key.hint{animation:pulse .7s infinite}
@keyframes pulse{50%{background:var(--c);color:#111}}
.keys.locked .key{opacity:.55}

/* ---------- 결과 / 도감 ---------- */
.head{font-size:34px;text-align:center;margin:14px 0 4px}
.sub{color:var(--sub);text-align:center;font-size:16px}
.result-score{font-family:"Black Han Sans",sans-serif;font-size:54px;text-align:center;color:var(--gold);margin-top:6px}
.result-stars{font-size:30px;text-align:center;color:var(--gold);letter-spacing:6px}
.panel{background:var(--panel);border-radius:18px;padding:12px 14px;margin-top:12px}
.panel h3{font-weight:normal;font-size:15px;color:var(--sub);margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:18px}
.row .nm{width:30px;text-align:center;font-family:"Black Han Sans",sans-serif}
.bar{flex:1;height:12px;background:rgba(0,0,0,.3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%}
.row .pc{width:44px;text-align:right;font-size:15px;color:var(--sub)}
.catch-list{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.catch-list svg{width:38px;height:38px}
#result{overflow-y:auto}
.dex{display:flex;flex-direction:column;gap:10px;overflow:auto;margin-top:12px;padding-bottom:10px}
.dex-row{background:var(--panel);border-radius:16px;padding:10px 12px}
.dex-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.dex-head b{font-family:"Black Han Sans",sans-serif;font-weight:normal;font-size:21px}
.dex-head small{color:var(--sub);font-size:14px}
.forms{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.slot{text-align:center;background:rgba(0,0,0,.22);border-radius:12px;padding:4px 2px 6px;font-size:12px;color:var(--sub);line-height:1.25}
.slot svg{width:100%;max-width:56px;height:auto;display:block;margin:0 auto}
.slot b{display:block;font-weight:normal;color:var(--ink);font-size:13px}
.slot .st{color:var(--gold);letter-spacing:-1px}
.new{display:inline-block;background:var(--gold);color:var(--gold-ink);font-size:13px;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.spacer{flex:1}

@media (max-height:700px){
  .encounter{min-height:76px;margin:8px 2px 6px}
  .portrait{width:72px;height:72px}.portrait svg{width:64px;height:64px}
  .status .line2{font-size:26px}
  .key{padding:10px 0 7px;font-size:24px}
  .title{font-size:38px}
}
@media (prefers-reduced-motion: reduce){ .runner .legs,.runner .leg2,.runner .tails,.runner .dust circle,.pm.pop svg,.key.hint{animation:none} }
</style>
</head>
<body>
<div class="app">

  <section class="screen active" id="start">
    <div>
      <h1 class="title disp">음표 몬스터 헌터<span>오선 위를 도망치는 복면 몬스터! 계이름을 맞혀서 복면을 벗겨라</span></h1>
      <div class="parade" id="parade"></div>
    </div>
    <div>
      <div class="stages" id="stages"></div>
      <button class="big" id="goBtn">사냥 시작</button>
      <button class="ghost" id="dexBtn">몬스터 도감</button>
    </div>
  </section>

  <section class="screen" id="game">
    <div class="top">
      <button class="back" id="quitBtn">그만하기</button>
      <div class="stage-tag" id="stageTag"></div>
      <div class="score" id="score">0</div>
    </div>
    <div class="party" id="party"></div>
    <div class="encounter">
      <div class="portrait" id="portrait"></div>
      <div class="status"><div class="line1" id="line1"></div><div class="line2" id="line2"></div></div>
    </div>
    <div class="field">
      <div class="staff-card" id="staffCard"></div>
    </div>
    <div class="progress" id="progress"></div>
    <div class="keys" id="keys"></div>
  </section>

  <section class="screen" id="result">
    <h2 class="head disp" id="resHead"></h2>
    <p class="sub" id="resSub"></p>
    <div class="result-score" id="resScore"></div>
    <div class="result-stars" id="resStars"></div>
    <div class="panel"><h3>이번에 잡은 몬스터</h3><div class="catch-list" id="resCatch"></div></div>
    <div class="panel" id="resRows"></div>
    <div class="spacer"></div>
    <button class="big" id="againBtn">다시 사냥</button>
    <button class="ghost" id="homeBtn">처음으로</button>
  </section>

  <section class="screen" id="dexScreen">
    <div class="top"><button class="back" id="dexBack">돌아가기</button></div>
    <h2 class="head disp">몬스터 도감</h2>
    <p class="sub" id="dexSub"></p>
    <div class="dex" id="dex"></div>
  </section>
</div>

<script>
/* ===== 몬스터 이름: 아이가 지은 이름으로 여기만 바꾸면 됨 ===== */
const MON_NAMES = ['도도링','레레곰','미미새','파파싹','솔솔방울','라라핀','시시별'];

const NOTES = [
  {name:'도', color:'#FF5A4E', dark:'#B7281F'},
  {name:'레', color:'#FF9B3D', dark:'#B65E0E'},
  {name:'미', color:'#F5C830', dark:'#A07E00'},
  {name:'파', color:'#3FCB74', dark:'#1C8445'},
  {name:'솔', color:'#3A9BFF', dark:'#155FB0'},
  {name:'라', color:'#7A6CFF', dark:'#3E31B8'},
  {name:'시', color:'#C266F0', dark:'#7B2BA6'},
];
/* d: 가온 도(C4)=0 기준 온음계 위치. 높은음자리표 맨 아래 줄=미(2), 낮은음자리표 맨 아래 줄=낮은 솔(-10) */
const CLEF = { t:{bottom:2, glyph:'𝄞'}, b:{bottom:-10, glyph:'𝄢'} };
const range = (a,b)=>Array.from({length:b-a+1},(_,k)=>a+k);
const STAGES = [
  {no:1, title:'높은음자리표', desc:'가온 도부터 높은 솔까지', pool:range(0,11).map(d=>['t',d]), sec:7},
  {no:2, title:'낮은음자리표', desc:'맨 아랫줄 솔부터 가온 도까지', pool:range(-10,0).map(d=>['b',d]), sec:7},
  {no:3, title:'두 음자리표 섞기', desc:'1단계와 2단계 음이 번갈아 나옴', pool:[...range(0,11).map(d=>['t',d]), ...range(-10,0).map(d=>['b',d])], sec:6.5},
  {no:4, title:'덧줄 도전', desc:'위아래 덧줄 음까지 모두', pool:[...range(-2,14).map(d=>['t',d]), ...range(-14,2).map(d=>['b',d])], sec:7, ledgerBoost:true},
];
const Q_COUNT = 20;
/* 같은 계이름이라도 음높이(옥타브)에 따라 모습이 다름. 어려운 음일수록 높은 등급 */
const FORMS = [
  {label:'기본형', prefix:'',      rank:1, oct:0},
  {label:'하늘형', prefix:'하늘 ', rank:2, oct:1},
  {label:'대지형', prefix:'대지 ', rank:3, oct:-1},
  {label:'심연형', prefix:'심연 ', rank:4, oct:-2},
  {label:'전설형', prefix:'전설 ', rank:5, oct:2},
];
const OCT_TO_FORM = {'0':0,'1':1,'-1':2,'-2':3,'2':4};
const formOf = d => OCT_TO_FORM[Math.floor(d/7)];
const formsFor = i => i===0 ? [0,1,2,3,4] : [0,1,2,3];     // 전설형은 아주 높은 도에만 존재
const OCT_WORD = {'-2':'아주 낮은 ','-1':'낮은 ','0':'','1':'높은 ','2':'아주 높은 '};
const pitchLabel = (oct, i) => oct===0 ? (i===0 ? '가온 도' : '가운데 '+NOTES[i].name) : OCT_WORD[oct] + NOTES[i].name;
const nameIdx = d => ((d % 7) + 7) % 7;
const freqOf = d => { const st=[0,2,4,5,7,9,11]; const midi = 60 + 12*Math.floor(d/7) + st[nameIdx(d)]; return 440*Math.pow(2,(midi-69)/12); };

/* ===== 저장 ===== */
const KEY = 'noteHunterSave_v3';
let save = {cf:{}, best:[0,0,0,0], stars:[0,0,0,0], miss:{}};   // cf: '계이름-형태' 별 포획 수
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) save = Object.assign(save, s); } catch(e){}
const cnt = (i,f) => save.cf[i+'-'+f] || 0;
const total = i => formsFor(i).reduce((a,f)=>a+cnt(i,f),0);
const bestForm = i => formsFor(i).filter(f=>cnt(i,f)).sort((a,b)=>FORMS[b].rank-FORMS[a].rank)[0];
const persist = ()=>{ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} };

/* ===== 소리 ===== */
let ac = null;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); return ac; }
function tone(freq, dur=1.0, type='triangle', vol=.32, delay=0){
  const a = audio(); if(!a) return;
  const t = a.currentTime + delay, g = a.createGain(); g.connect(a.destination);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  [[freq,type,1],[freq*2,'sine',.22]].forEach(([f,ty,m])=>{ const o=a.createOscillator(), og=a.createGain(); o.type=ty; o.frequency.value=f; og.gain.value=m; o.connect(og); og.connect(g); o.start(t); o.stop(t+dur); });
}
const sfxCatch = ()=>{ tone(880,.12,'square',.07,.2); tone(1320,.25,'square',.07,.3); };
const sfxWrong = ()=>{ tone(140,.2,'sawtooth',.08); };
const sfxEscape = ()=>{ tone(400,.15,'square',.06); tone(300,.15,'square',.06,.12); tone(200,.3,'square',.06,.24); };

/* ===== 몬스터 초상 (창작 캐릭터) ===== */
function mix(hex, to, t){
  const a=[1,3,5].map(k=>parseInt(hex.substr(k,2),16)), b=[1,3,5].map(k=>parseInt(to.substr(k,2),16));
  return '#'+a.map((v,k)=>Math.round(v+(b[k]-v)*t).toString(16).padStart(2,'0')).join('');
}
const mirror = p => p + `<g transform="translate(100 0) scale(-1 1)">${p}</g>`;
function monsterSVG(i, f=0, {sil=false}={}){
  const base = NOTES[i].color;
  let c = base, d = NOTES[i].dark;
  if (f===1){ c = mix(base,'#FFFFFF',.28); }
  if (f===2){ c = mix(base,'#000000',.22); d = mix(NOTES[i].dark,'#000000',.35); }
  if (f===3){ c = mix(base,'#0B1020',.72); d = mix(base,'#0B1020',.45); }
  if (f===4){ c = mix(base,'#FFF4D0',.35); d = '#E0A800'; }
  if (sil){ c = d = 'var(--sil)'; }
  const parts = [
    `<path d="M30 32 C20 16 28 6 33 1 C35 13 45 17 41 31Z M70 32 C80 16 72 6 67 1 C65 13 55 17 59 31Z" fill="${sil?d:(f===3?base:'#FFB020')}"/>`,
    `<path d="M26 34 L32 12 L42 30Z M42 27 L50 6 L58 27Z M58 30 L68 12 L74 34Z" fill="${d}"/>`,
    `<path d="M44 28 C36 8 48 4 50 22 C54 4 68 10 56 28Z" fill="${d}"/><path d="M14 60 L2 52 L8 70Z M86 60 L98 52 L92 70Z" fill="${d}"/>`,
    `<path d="M50 24 C60 4 80 6 78 14 C68 16 60 20 56 28Z" fill="${d}"/><path d="M14 54 L4 48 L12 62Z M86 54 L96 48 L88 62Z M16 72 L6 72 L16 80Z M84 72 L94 72 L84 80Z" fill="${d}"/>`,
    `<path d="M40 26 C48 2 64 -2 70 4 C60 10 58 18 60 28Z" fill="${d}"/><path d="M14 66 C0 62 0 74 6 80 C10 74 14 72 18 72Z M86 66 C100 62 100 74 94 80 C90 74 86 72 82 72Z" fill="${d}"/>`,
    `<path d="M18 52 L0 30 L6 56 L0 72 L20 66Z M82 52 L100 30 L94 56 L100 72 L80 66Z" fill="${d}"/><path d="M30 32 L26 8 L44 26Z M70 32 L74 8 L56 26Z" fill="${d}"/>`,
    `<path d="M50 26 L43 10 L50 -2 L57 10Z" fill="${sil?d:'#EBD4FF'}"/><path d="M30 34 L20 16 L36 28Z M70 34 L80 16 L64 28Z" fill="${sil?d:'#EBD4FF'}"/>`,
  ];
  const wing = col => mirror(`<path d="M22 58 C4 50 -2 30 6 22 C10 32 14 36 18 38 C12 26 14 14 22 12 C24 26 28 34 32 42Z" fill="${col}" opacity=".95"/>`);
  let behind = '', over = '', body = `<path d="M50 22 C74 22 86 40 86 60 C86 80 70 90 50 90 C30 90 14 80 14 60 C14 40 26 22 50 22Z" fill="${c}"/>`;
  if (f===1) behind += wing(sil?d:'#FFFFFF');
  if (f===2){
    body = `<path d="M50 24 C78 24 92 44 92 64 C92 84 74 92 50 92 C26 92 8 84 8 64 C8 44 22 24 50 24Z" fill="${c}"/>`;
    behind += mirror(`<path d="M18 86 L14 97 L24 90 L28 98 L32 88Z" fill="${d}"/>`);
    over += sil ? '' : mirror(`<path d="M6 58 L20 42 L36 50 L26 68Z" fill="#8A7A66" stroke="#463B2F" stroke-width="2"/>`) + `<path d="M24 80 Q50 88 76 80 L74 86 Q50 94 26 86Z" fill="#6B5D4C"/>`;
  }
  if (f===3){
    behind += `<path d="M18 78 L22 98 L32 86 L40 99 L50 88 L60 99 L68 86 L78 98 L82 78Z" fill="${d}"/>`;
    over += sil ? '' : `<path d="M22 64 Q28 58 33 66 M67 66 Q72 58 78 64 M42 84 L50 78 L58 84" stroke="${base}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  }
  if (f===4){
    behind += `<circle cx="50" cy="54" r="48" fill="none" stroke="#FFC93C" stroke-width="3" stroke-dasharray="7 5"/>` + wing(sil?d:'#FFD86B');
    over += sil ? '' : `<path d="M50 32 L55 40 L50 48 L45 40Z" fill="#FFC93C" stroke="#9A6A00" stroke-width="1.2"/>`;
  }
  const eyeFill = f===3 ? base : '#fff', pupil = f===3 ? '#fff' : '#111';
  const face = sil
    ? `<text x="50" y="72" text-anchor="middle" font-size="34" fill="#C7D3F0" font-family="'Black Han Sans',sans-serif">?</text>`
    : `<path d="M28 76 C34 86 66 86 72 76 C66 70 34 70 28 76Z" fill="#fff" opacity="${f===3?.06:.18}"/>
       <path d="M28 46 L46 53 Q40 61 31 57Z M72 46 L54 53 Q60 61 69 57Z" fill="${eyeFill}"/>
       <circle cx="39" cy="55" r="${f===3?2:3}" fill="${pupil}"/><circle cx="61" cy="55" r="${f===3?2:3}" fill="${pupil}"/>
       ${i===2 ? `<path d="M43 64 L57 64 L50 74Z" fill="#FF8A1F" stroke="#9A4A00" stroke-width="1.5" stroke-linejoin="round"/>`
               : `<path d="M42 68 Q50 72 58 68" stroke="${f===3?base:'#111'}" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M45 69 L47 74 L49 69.6Z M55 69 L53 74 L51 69.6Z" fill="#fff"/>`}`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${behind}${parts[i]}${body}${over}${face}</svg>`;
}

/* ===== 오선지 ===== */
const SP = 14, BOTTOM_Y = 114, X0 = 74, X1 = 306, VW = 330;
const yOf = (clef, d) => BOTTOM_Y - (d - CLEF[clef].bottom) * (SP/2);
function staffSVG(clef){
  let s = '';
  for (let k=0;k<5;k++) s += `<line x1="8" x2="${VW-8}" y1="${BOTTOM_Y-k*SP}" y2="${BOTTOM_Y-k*SP}" stroke="#1B2238" stroke-width="2"/>`;
  const clefSvg = clef==='t'
    ? `<text x="12" y="${BOTTOM_Y}" font-size="56" font-family="ClefFont" fill="#1B2238">𝄞</text>`
    : `<text x="14" y="${BOTTOM_Y}" font-size="56" font-family="ClefFont" fill="#1B2238">𝄢</text>`;
  return `<svg viewBox="0 0 ${VW} 172" role="img" aria-label="오선 위의 음표 몬스터">${s}${clefSvg}<g id="runner" class="runner"></g></svg>`;
}
let runnerId = 0;
function runnerSVG(clef, d){
  const y = yOf(clef, d), b = CLEF[clef].bottom, id = 'hc' + (++runnerId);
  let led = '';
  for (let l=b-2; l>=d; l-=2) led += `<line x1="-17" x2="17" y1="${yOf(clef,l)}" y2="${yOf(clef,l)}" stroke="#1B2238" stroke-width="2"/>`;
  for (let l=b+10; l<=d; l+=2) led += `<line x1="-17" x2="17" y1="${yOf(clef,l)}" y2="${yOf(clef,l)}" stroke="#1B2238" stroke-width="2"/>`;
  // 머리(=음표 머리)는 정확히 그 줄/칸에, 복면 띠와 펄럭이는 매듭, 달리는 다리, 먼지
  return `${led}
    <g class="dust" fill="#8C93A8"><circle cx="-24" cy="${y+8}" r="2.2"/><circle cx="-30" cy="${y+6}" r="1.7"/><circle cx="-35" cy="${y+9}" r="1.3"/></g>
    <path class="legs" d="M-3 ${y+5} L-7 ${y+11} L-10 ${y+11}" stroke="#1B2238" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="leg2" d="M4 ${y+5} L6 ${y+11} L10 ${y+11}" stroke="#1B2238" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="tails">
      <path d="M-9 ${y-3} C-15 ${y-8} -19 ${y-1} -27 ${y-6}" stroke="#05070D" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M-9 ${y-1} C-15 ${y+2} -19 ${y-3} -26 ${y+3}" stroke="#05070D" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="rotate(-18 0 ${y})">
      <clipPath id="${id}"><ellipse cx="0" cy="${y}" rx="10.5" ry="7.4"/></clipPath>
      <ellipse cx="0" cy="${y}" rx="10.5" ry="7.4" fill="#2E3654"/>
      <rect x="-12" y="${y-4}" width="24" height="5.6" fill="#05070D" clip-path="url(#${id})"/>
      <circle cx="-9.6" cy="${y-1.2}" r="1.9" fill="#05070D"/>
      <path d="M-1.5 ${y-2.6} L3 ${y-1.2} Q1 ${y+0.4} -1.2 ${y-0.6}Z M4.6 ${y-1.2} L8.6 ${y-2.6} Q8.2 ${y-0.2} 5.6 ${y-0.4}Z" fill="#fff"/>
      <circle cx="1.6" cy="${y-1.3}" r=".75" fill="#05070D"/><circle cx="7.2" cy="${y-1.4}" r=".75" fill="#05070D"/>
    </g>`;
}

/* ===== 화면 ===== */
const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===id));

let stageIdx = 0;
function renderStart(){
  $('parade').innerHTML = NOTES.map((_,i)=>{ const b=bestForm(i); return monsterSVG(i, b??0, {sil:b===undefined}); }).join('');
  $('stages').innerHTML = STAGES.map((s,i)=>`
    <button class="stage-btn ${i===stageIdx?'sel':''}" data-i="${i}">
      <span class="no">${s.no}</span><span class="tx">${s.title}<small>${s.desc}</small></span>
      <span class="rec"><b>${'★'.repeat(save.stars[i])}${'☆'.repeat(3-save.stars[i])}</b>${save.best[i]?`최고 ${save.best[i]}`:'기록 없음'}</span></button>`).join('');
  $('stages').querySelectorAll('.stage-btn').forEach(b=>b.onclick=()=>{ stageIdx=+b.dataset.i; renderStart(); });
}
function renderParty(pop=-1){
  $('party').innerHTML = NOTES.map((n,i)=>{ const b=bestForm(i);
    return `<div class="pm ${i===pop?'pop':''}">${monsterSVG(i, b??0, {sil:b===undefined})}<b>${n.name}</b> ×${total(i)}</div>`; }).join('');
}

/* ===== 게임 진행 ===== */
let G = null;
function pick(){
  const st = STAGES[stageIdx], pool = [];
  st.pool.forEach(([c,d])=>{
    const k = c+d; if (k===G.lastKey) return;
    const isLedger = d < CLEF[c].bottom-1 || d > CLEF[c].bottom+9;
    let w = 1 + Math.min(save.miss[k]||0, 4) + (st.ledgerBoost && isLedger ? 1 : 0);
    while (w--) pool.push([c,d]);
  });
  return pool[Math.floor(Math.random()*pool.length)];
}
function startGame(){
  audio();
  G = {q:0, results:[], combo:0, score:0, lastKey:'', caughtNow:[], stat:{}, lock:true, raf:0};
  $('stageTag').textContent = `${STAGES[stageIdx].no}단계 ${STAGES[stageIdx].title}`;
  $('keys').innerHTML = NOTES.map((n,i)=>`<button class="key" style="--c:${n.color}" data-i="${i}">${n.name}</button>`).join('');
  $('keys').querySelectorAll('.key').forEach(b=>b.onpointerdown=e=>{ e.preventDefault(); answer(+b.dataset.i); });
  $('score').textContent = 0;
  renderParty(); show('game'); nextQ();
}
function renderProgress(){
  $('progress').innerHTML = Array.from({length:Q_COUNT},(_,k)=>{ const r=G.results[k]; return `<i class="${r===true?'ok':r===false?'miss':k===G.q?'now':''}"></i>`; }).join('');
}
function setStatus(l1, l2){ $('line1').innerHTML = l1; $('line2').innerHTML = l2; }

function nextQ(){
  if (!G) return;
  if (G.q >= Q_COUNT) return finish();
  const [clef, d] = pick();
  const ni = nameIdx(d);
  G.lastKey = clef+d;
  const speed = Math.max(0.6, 1 - 0.04*G.combo);
  G.cur = {clef, d, ni, T: STAGES[stageIdx].sec*1000*speed, t:0, wrong:false, prev:0};
  $('staffCard').innerHTML = staffSVG(clef) + `<div class="combo ${G.combo>=2?'on':''}">${G.combo}콤보</div><div class="timer" id="timer"></div>`;
  $('runner').innerHTML = runnerSVG(clef, d);
  $('portrait').className = 'portrait';
  $('portrait').innerHTML = monsterSVG(ni, formOf(d), {sil:true});
  setStatus('복면 몬스터가 도망친다!', '이 음은 뭘까?');
  $('keys').classList.remove('locked');
  $('keys').querySelectorAll('.key').forEach(k=>k.classList.remove('hint'));
  renderProgress();
  G.lock = false;
  G.raf = requestAnimationFrame(frame);
}
function frame(ts){
  if (!G || G.lock) return;
  const c = G.cur;
  if (!c.prev) c.prev = ts;
  c.t += ts - c.prev; c.prev = ts;
  const f = Math.min(c.t / c.T, 1);
  c.x = X0 + (X1 - X0) * f;
  $('runner').setAttribute('transform', `translate(${c.x} 0)`);
  $('timer').style.width = (f*100)+'%';
  if (f >= 1) return escape();
  G.raf = requestAnimationFrame(frame);
}
function floatText(text, color){
  const c = G.cur, card = $('staffCard'), el = document.createElement('div');
  el.className = 'float'; el.textContent = text; if (color) el.style.color = color;
  el.style.left = (c.x/VW*100)+'%'; el.style.top = (yOf(c.clef,c.d)/172*100)+'%';
  card.appendChild(el); setTimeout(()=>el.remove(), 900);
}
function answer(i){
  if (!G || G.lock) return;
  const c = G.cur, n = NOTES[c.ni], name = MON_NAMES[c.ni];
  G.stat[c.ni] = G.stat[c.ni] || {ok:0, all:0};
  if (i === c.ni){
    G.lock = true; cancelAnimationFrame(G.raf);
    tone(freqOf(c.d)); sfxCatch();
    const left = 1 - c.t / c.T;
    const pts = Math.round((100 + 100*left) * (1 + 0.1*G.combo) * (c.wrong ? 0.5 : 1));
    if (!c.wrong){ G.combo++; G.stat[c.ni].ok++; if (save.miss[G.lastKey]) save.miss[G.lastKey]--; }
    G.stat[c.ni].all++;
    G.score += pts; G.results[G.q] = !c.wrong;
    const f = formOf(c.d), F = FORMS[f], k = c.ni+'-'+f, isNew = !save.cf[k];
    save.cf[k] = (save.cf[k]||0) + 1; G.caughtNow.push([c.ni,f]); persist();
    $('score').textContent = G.score;
    $('portrait').innerHTML = monsterSVG(c.ni, f);
    $('portrait').className = 'portrait reveal';
    setStatus(`${pitchLabel(Math.floor(c.d/7), c.ni)} · ${F.label} <span style="color:var(--gold)">${'★'.repeat(F.rank)}</span>${isNew?'<span class="new">NEW</span>':''}`,
      `<span style="color:${f===3?n.color:mix(n.color,'#FFFFFF',f===1||f===4?.3:0)}">${F.prefix}${name}</span><small>포획!</small>`);
    floatText(`+${pts}`);
    $('runner').innerHTML = '';
    renderParty(c.ni);
    G.q++; renderProgress();
    setTimeout(nextQ, isNew ? 1700 : 1250);
  } else {
    if (!c.wrong){ c.wrong = true; G.stat[c.ni].all++; save.miss[G.lastKey] = (save.miss[G.lastKey]||0)+1; persist(); }
    G.combo = 0; sfxWrong();
    if (navigator.vibrate) navigator.vibrate(60);
    c.t = Math.min(c.t + c.T*0.2, c.T*0.97);   // 틀리면 몬스터가 앞으로 돌진
    floatText('돌진!', '#FF5C6C');
    setStatus(`${NOTES[i].name}가 아니야!`, '더 빨리 도망친다!');
    const cb = $('staffCard').querySelector('.combo'); if (cb) cb.classList.remove('on');
  }
}
function escape(){
  const c = G.cur, n = NOTES[c.ni];
  G.lock = true; G.combo = 0; G.results[G.q] = false;
  if (!c.wrong){ G.stat[c.ni] = G.stat[c.ni] || {ok:0,all:0}; G.stat[c.ni].all++; save.miss[G.lastKey] = (save.miss[G.lastKey]||0)+1; persist(); }
  sfxEscape(); setTimeout(()=>tone(freqOf(c.d)), 450);
  $('portrait').innerHTML = monsterSVG(c.ni, formOf(c.d));
  setStatus(`${FORMS[formOf(c.d)].prefix}${MON_NAMES[c.ni]} 도망!`, `정답은 <span style="color:${n.color}">${n.name}</span>`);
  $('keys').classList.add('locked');
  $('keys').querySelectorAll('.key')[c.ni].classList.add('hint');
  $('runner').setAttribute('transform', `translate(${(X0+X1)/2} 0)`);   // 정답 위치를 다시 보여줌
  G.q++; renderProgress();
  setTimeout(nextQ, 2000);
}

/* ===== 결과 ===== */
function finish(){
  const caught = G.caughtNow.length, clean = G.results.filter(Boolean).length;
  const r = clean/Q_COUNT, stars = r>=.95?3: r>=.8?2: r>=.5?1:0;
  const newBest = G.score > save.best[stageIdx];
  if (newBest) save.best[stageIdx] = G.score;
  if (stars > save.stars[stageIdx]) save.stars[stageIdx] = stars;
  persist();
  $('resHead').textContent = stars===3?'완벽한 사냥!': stars===2?'실력 좋은데?': stars===1?'조금만 더!':'다시 도전!';
  $('resSub').textContent = `${Q_COUNT}마리 중 ${caught}마리 포획, 한 번에 맞힌 건 ${clean}마리${newBest?' · 최고 기록!':''}`;
  $('resScore').textContent = G.score;
  $('resStars').textContent = '★'.repeat(stars)+'☆'.repeat(3-stars);
  $('resCatch').innerHTML = caught ? G.caughtNow.map(([i,f])=>monsterSVG(i,f)).join('') : '<p class="sub">이번엔 모두 놓쳤어</p>';
  $('resRows').innerHTML = '<h3>계이름별 한 번에 맞힌 비율</h3>' + Object.keys(G.stat).sort((a,b)=>a-b).map(k=>{
    const s=G.stat[k], p=Math.round(s.ok/s.all*100);
    return `<div class="row"><span class="nm" style="color:${NOTES[k].color}">${NOTES[k].name}</span><span class="bar"><i style="width:${p}%;background:${NOTES[k].color}"></i></span><span class="pc">${s.ok}/${s.all}</span></div>`; }).join('');
  G = null; show('result');
}

/* ===== 도감 ===== */
function renderDex(){
  const all = NOTES.reduce((a,_,i)=>a+formsFor(i).length,0);
  const got = NOTES.reduce((a,_,i)=>a+formsFor(i).filter(f=>cnt(i,f)).length,0);
  $('dexSub').textContent = `${got}/${all} 형태 발견 · 같은 계이름도 음높이에 따라 모습이 달라`;
  $('dex').innerHTML = NOTES.map((n,i)=>{
    const fs = formsFor(i).slice().sort((a,b)=>FORMS[a].rank-FORMS[b].rank), seen = fs.filter(f=>cnt(i,f)).length;
    return `<div class="dex-row"><div class="dex-head"><b style="color:${total(i)?n.color:'var(--sub)'}">${total(i)?MON_NAMES[i]:'???'}</b>
      <small>계이름 ${n.name} · ${seen}/${fs.length} 형태 · ${total(i)}마리</small></div>
      <div class="forms">${fs.map(f=>{ const k=cnt(i,f), F=FORMS[f];
        return `<div class="slot">${monsterSVG(i,f,{sil:!k})}<b>${k?F.label:'???'}</b><span class="st">${'★'.repeat(F.rank)}</span><br>${k?`×${k}`:pitchLabel(F.oct,i)}</div>`; }).join('')}</div></div>`; }).join('');
  show('dexScreen');
}

$('goBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('dexBtn').onclick = renderDex;
const home = ()=>{ if (G){ G.lock=true; cancelAnimationFrame(G.raf); G=null; } renderStart(); show('start'); };
$('dexBack').onclick = home; $('homeBtn').onclick = home; $('quitBtn').onclick = home;
renderStart();
</script>
</body>
</html>
